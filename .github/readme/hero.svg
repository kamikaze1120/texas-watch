<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Texas Watch — public-safety situational awareness</title>
  <desc id="desc">Animated night background with purple nebula and a red glow. A tactical radar scope with a lone star at its centre sweeps around while incident pings pulse in severity colours.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020317"/>
      <stop offset=".52" stop-color="#071238"/>
      <stop offset="1" stop-color="#13052d"/>
    </linearGradient>
    <radialGradient id="purpleCloud">
      <stop stop-color="#d43cff" stop-opacity=".62"/>
      <stop offset=".34" stop-color="#8d22ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4215a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redCloud">
      <stop stop-color="#ff6b6b" stop-opacity=".42"/>
      <stop offset=".35" stop-color="#d8283c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6d0a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scope">
      <stop stop-color="#0b1a3f" stop-opacity=".95"/>
      <stop offset="1" stop-color="#04061d" stop-opacity=".95"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a96b18"/>
      <stop offset=".28" stop-color="#ffe293"/>
      <stop offset=".55" stop-color="#f4bb4d"/>
      <stop offset=".82" stop-color="#fff0b7"/>
      <stop offset="1" stop-color="#b87519"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4C65A" stop-opacity="0"/>
      <stop offset="1" stop-color="#F4C65A" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset=".45" stop-color="#af75ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.2" fill="#fff7d4" opacity=".9"/>
      <circle cx="61" cy="36" r=".7" fill="#d7b5ff" opacity=".76"/>
      <circle cx="112" cy="17" r=".9" fill="#fff" opacity=".72"/>
      <circle cx="140" cy="68" r="1.1" fill="#ffd972" opacity=".8"/>
      <circle cx="83" cy="91" r=".55" fill="#fff" opacity=".58"/>
      <circle cx="31" cy="100" r=".75" fill="#c68cff" opacity=".78"/>
    </pattern>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dy="18" stdDeviation="20" flood-color="#000017" flood-opacity=".8"/></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="34"/></clipPath>
    <clipPath id="scopeClip"><circle r="150"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <ellipse cx="260" cy="140" rx="340" ry="210" fill="url(#purpleCloud)" filter="url(#blur)">
      <animate attributeName="rx" values="310;380;310" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="230" rx="300" ry="200" fill="url(#redCloud)" filter="url(#blur)">
      <animate attributeName="ry" values="175;230;175" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-150" width="1500" height="520" fill="url(#stars)" opacity=".78">
      <animateTransform attributeName="transform" type="translate" values="0 0;150 0" dur="46s" repeatCount="indefinite"/>
    </rect>

    <!-- Radar scope -->
    <g transform="translate(958 210)">
      <circle r="150" fill="url(#scope)" stroke="url(#gold)" stroke-width="2" filter="url(#shadow)"/>
      <g fill="none" stroke="#F4C65A" stroke-opacity=".2">
        <circle r="112"/>
        <circle r="75"/>
        <circle r="38"/>
        <line x1="-150" y1="0" x2="150" y2="0"/>
        <line x1="0" y1="-150" x2="0" y2="150"/>
      </g>
      <circle r="168" fill="none" stroke="#bc52ff" stroke-width="1" stroke-dasharray="2 14" opacity=".5">
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="40s" repeatCount="indefinite"/>
      </circle>
      <g clip-path="url(#scopeClip)">
        <path d="M0 0 L150 0 A150 150 0 0 0 106 -106 Z" fill="url(#sweep)">
          <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- incident pings: critical / high / medium / low -->
      <g>
        <circle cx="-62" cy="-48" r="5" fill="#ff4d5e" filter="url(#glow)"/>
        <circle cx="-62" cy="-48" r="5" fill="none" stroke="#ff4d5e">
          <animate attributeName="r" values="5;22" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".9;0" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="70" cy="-30" r="4.5" fill="#ff9f43" filter="url(#glow)"/>
        <circle cx="70" cy="-30" r="4.5" fill="none" stroke="#ff9f43">
          <animate attributeName="r" values="4.5;18" dur="2.6s" begin=".7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".9;0" dur="2.6s" begin=".7s" repeatCount="indefinite"/>
        </circle>
      </g>
      <circle cx="38" cy="78" r="4" fill="#F4C65A" filter="url(#glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-88" cy="60" r="4" fill="#7fb8ff" filter="url(#glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="104" cy="44" r="3.5" fill="#7fb8ff" filter="url(#glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin=".4s" repeatCount="indefinite"/>
      </circle>

      <!-- lone star -->
      <path d="M0 -17 L4.9 -6.7 L16.2 -5.3 L7.9 2.6 L10 13.8 L0 8.3 L-10 13.8 L-7.9 2.6 L-16.2 -5.3 L-4.9 -6.7 Z" fill="#fff0b7" filter="url(#glow)"/>
    </g>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.3">
      <circle cx="770" cy="392" r="4" fill="#ff4d5e"/><text x="780" y="396" fill="#ffc2c8">CRITICAL</text>
      <circle cx="862" cy="392" r="4" fill="#ff9f43"/><text x="872" y="396" fill="#ffd9b0">HIGH</text>
      <circle cx="928" cy="392" r="4" fill="#F4C65A"/><text x="938" y="396" fill="#ffe7a2">MEDIUM</text>
      <circle cx="1010" cy="392" r="4" fill="#7fb8ff"/><text x="1020" y="396" fill="#cfe3ff">LOW</text>
    </g>

    <!-- Identity panel -->
    <g filter="url(#shadow)">
      <rect x="56" y="52" width="660" height="316" rx="28" fill="#060a25" fill-opacity=".58" stroke="url(#gold)" stroke-opacity=".82"/>
      <rect x="68" y="64" width="636" height="292" rx="22" fill="url(#glass)" stroke="#ff6b7a" stroke-opacity=".22"/>
    </g>
    <path d="M96 102H318" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="96" cy="102" r="5" fill="#ff4d5e" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="114" y="107" fill="#f9d777" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3">PUBLIC-SAFETY CONSOLE / TEXAS</text>
    <text x="94" y="192" fill="url(#gold)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="3">TEXAS WATCH</text>
    <text x="98" y="236" fill="#ffb3bb" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" letter-spacing="4">LIVE DISPATCH · WEATHER · ROADS</text>
    <text x="98" y="276" fill="#d9c7f2" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17">Open government feeds, fused onto one tactical map.</text>

    <g transform="translate(98 304)">
      <rect width="160" height="40" rx="20" fill="#2a0d18" fill-opacity=".8" stroke="#ff4d5e" stroke-opacity=".7"/>
      <circle cx="21" cy="20" r="5" fill="#ff4d5e" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="36" y="25" fill="#ffd0d5" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">15s POLLING</text>
    </g>
    <g transform="translate(272 304)">
      <rect width="168" height="40" rx="20" fill="#1d1732" fill-opacity=".8" stroke="#f3c454" stroke-opacity=".65"/>
      <text x="20" y="25" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">5 CITY CAD FEEDS</text>
    </g>
    <g transform="translate(454 304)">
      <rect width="208" height="40" rx="20" fill="#111331" fill-opacity=".8" stroke="#9f62ff" stroke-opacity=".66"/>
      <text x="20" y="25" fill="#dcc9ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">TxDOT LIVE CAMERAS</text>
    </g>

    <rect x="0" y="0" width="1200" height="420" rx="34" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="10" y="10" width="1180" height="400" rx="27" fill="none" stroke="#ff4d5e" stroke-opacity=".14"/>
    <rect x="0" y="-45" width="1200" height="34" fill="#f7cf68" opacity=".04"><animate attributeName="y" values="-45;450" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
